<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ss778 Inspection Services</title>
<style>
  :root {
    --red: #b3172b;
    --dark: #2b2b2b;
    --paper: #ffffff;
    --muted: #6b6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--dark);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    border: 1px solid #e6e6e6;
    border-top: 4px solid var(--red);
    padding: 40px 36px;
    text-align: center;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  .tagline {
    color: var(--red);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin: 0 0 24px;
  }
  .name {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .role {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 20px;
  }
  .contact {
    font-size: 0.95rem;
    line-height: 1.7;
    margin: 0 0 28px;
  }
  .contact a {
    color: var(--dark);
    text-decoration: none;
  }
  .contact a:hover {
    color: var(--red);
  }
  .logos {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin: 0 0 28px;
  }
  .logos img {
    height: 90px;
    width: auto;
  }
  .sop {
    font-size: 0.85rem;
    margin: 0 0 28px;
  }
  .sop a {
    color: var(--red);
    text-decoration: none;
    border-bottom: 1px solid var(--red);
  }
  .sop a:hover {
    opacity: 0.75;
  }
  footer {
    border-top: 1px solid #e6e6e6;
    padding-top: 16px;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  @media (max-width: 480px) {
    .logos { gap: 10px; }
    .logos img { height: 64px; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>ss778 Inspection Services™</h1>
    <p class="tagline">CCPIA Certified &mdash; Commercial Property Inspection</p>

    <p class="name">Dmitry Baycharov</p>
    <p class="role">Inspector</p>

    <p class="contact">
      <a href="mailto:omskconsulting@proton.me">omskconsulting@proton.me</a><br>
      <a href="tel:+19202406670">(920) 240-6670</a>
    </p>

    <div class="logos">
      <img src="1.png" alt="CCPIA Certified Commercial Property Inspectors Association">
      <img src="2.png" alt="CCPIA Certified Commercial Property Inspector">
      <img src="3.png" alt="CCPIA Building Excellence">
    </div>

    <p class="sop">
      <a href="https://ccpia.org/international-standards-of-practice-for-inspecting-commercial-properties-comsop/" target="_blank" rel="noopener">
        International Standards of Practice for Inspecting Commercial Properties (ComSOP)
      </a>
    </p>

    <footer>OMSK CONSULTING LLC</footer>
  </div>
</body>
</html>
